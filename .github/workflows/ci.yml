name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-mesh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Verify RadarHeal CLI plan is approval-gated
        shell: bash
        run: |
          set +e
          node dist/src/radar-heal/cli.js check \
            --contract examples/radar-heal/contract.json \
            --input examples/radar-heal/drifted.json \
            --baseline examples/radar-heal/baseline.json \
            --output radar-report.json
          status=$?
          set -e
          test "$status" -eq 2
          node dist/src/radar-heal/cli.js heal \
            --report radar-report.json \
            --collector c_example123 \
            --url https://example.com/releases \
            --output radar-plan.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('radar-plan.json','utf8'));if(!p.approvalRequired||p.command.autoApprove!==false||p.command.args.includes('--auto-approve'))process.exit(1)"
