[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "nymrel-crawler-mesh"
version = "1.0.0"
description = "Bounded, zero-telemetry HTTP crawler and Markdown/JSON extractor for agent workflows"
readme = "README.md"
authors = [{ name = "Nymrel", email = "contact@nymrel.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["crawler", "scraper", "markdown", "llm", "ai-agent", "rag", "robots-txt", "sitemap", "zero-telemetry", "nymrel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.scripts]
crawler-mesh-py = "nymrel_crawler_mesh.cli:main"

[project.urls]
Homepage = "https://nymrel.com"
Repository = "https://github.com/nymrel/nymrel-crawler-mesh"
Issues = "https://github.com/nymrel/nymrel-crawler-mesh/issues"
Security = "https://github.com/nymrel/nymrel-crawler-mesh/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["python/nymrel_crawler_mesh"]

[tool.hatch.build.targets.sdist]
include = [
    "python/nymrel_crawler_mesh",
    "tests",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
