[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nymrel_crawler_mesh"
version = "1.0.0"
description = "High-throughput, zero-telemetry web crawler & clean markdown/JSON extractor built for AI agents and LLMs"
readme = "README.md"
authors = [{ name = "Nymrel / JalenBuilds LLC", email = "contact@nymrel.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["crawler", "scraper", "markdown", "llm", "ai-agent", "rag", "robots-txt", "sitemap", "zero-telemetry", "nymrel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[project.scripts]
crawler-mesh-py = "nymrel_crawler_mesh.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
